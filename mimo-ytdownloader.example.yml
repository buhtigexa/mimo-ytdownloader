# mimo-ytdownloader config. Only output_dir is required; everything else shows its default.

output_dir: ./out               # where files land (created if missing)
workers: 4                      # parallel downloads (1..64). YouTube throttles past ~6-8
attempts: 3                     # tries per URL for transient errors (429, 5xx, timeouts)
retry_backoff_secs: 5           # wait N*backoff before retry N
timeout_secs: 900               # deadline per attempt; yt-dlp and ffmpeg are killed when it passes
expand_playlists: true          # youtube.com/playlist?list=... -> one parallel download per video
                                # (a video inside a playlist, watch?v=X&list=Y, still downloads only X)

audio:
  format: mp3                   # original | mp3 | m4a | opus | flac | wav
                                # original = YouTube stream untouched (Opus ~160k), best fidelity, no ffmpeg
  quality: "0"                  # yt-dlp --audio-quality: "0" = best VBR, or e.g. "320K"
  embed_metadata: true          # title/artist tags
  embed_thumbnail: false        # cover art (needs ffmpeg; not supported for wav)

ytdlp:
  path: yt-dlp                  # binary name or path (pipx install yt-dlp)
  # ffmpeg_location: /opt/ffmpeg/bin
  output_template: "%(title)s [%(id)s].%(ext)s"
  skip_existing: true           # download archive: re-runs skip finished URLs
  # archive_file: ./out/.mimo-ytdownloader-archive.txt   # default: <output_dir>/.mimo-ytdownloader-archive.txt
  concurrent_fragments: 4       # parallel fragment fetch inside each download
  # cookies_from_browser: firefox   # for age-restricted / members-only videos
  extra_args: []                # passed verbatim to yt-dlp, e.g. ["--limit-rate", "5M"]
